function badge(dna) {
  return `<span class="dna-badge badge-${dna}">${dna.replace(/_/g,' ')}</span>`;
}

function compClass(c) {
  return `<span class="comp-${c}">${c.replace(/_/g,' ')}</span>`;
}

function card(r) {
  return `<div class="card" onclick="showDetail(${r.ac})">
    <div class="card-header">
      <div>
        <div class="ac-name">${r.name} <span style="font-weight:400;color:#888;font-size:12px;">AC-${r.ac}</span></div>
        <div style="font-size:11px;color:#888;margin-top:2px;">${r.district} &middot; ${r.pc_name} &middot; ${r.reservation}</div>
      </div>
      <div>${badge(r.dna)}</div>
    </div>
    <div class="card-body">
      <div class="row"><span><strong>2022:</strong> ${r.w2022} (${r.p2022})</span><span><strong>Margin:</strong> ${r.m2022}%</span></div>
      <div class="row"><span><strong>MLA:</strong> ${r.mla} (${r.mla_party})</span><span><strong>MP:</strong> ${r.mp} (${r.mp_party})</span></div>
      <div class="row"><span><strong>2017:</strong> ${r.p2017} &rarr; <strong>2022:</strong> ${r.p2022}</span><span><strong>LS2024:</strong> ${r.ls24_party}</span></div>
      <div class="row"><span>${compClass(r.comp)} &middot; Avg margin: ${r.comp_margin}% &middot; Trend: ${r.comp_trend||'N/A'}</span></div>
    </div>
  </div>`;
}

function showDetail(ac) {
  const r = DATA.find(x => x.ac === ac);
  if (!r) return;
  document.getElementById('overlay').classList.add('open');

  function el(v) { return v && v !== 'N/A' ? v : '<span style="color:#999">N/A</span>'; }

  document.getElementById('detail-content').innerHTML = `
    <h2>${r.name} <span style="font-weight:400;color:#888;font-size:14px;">AC-${r.ac}</span></h2>
    <div class="subtitle">${r.cid} &middot; ${r.district} &middot; ${r.division} &middot; ${r.region} &middot; ${r.reservation} &middot; ${r.pc_name} (PC-${r.pc_num})</div>
    <div style="margin-bottom:12px">${badge(r.dna)} ${compClass(r.comp)}</div>
    <div class="section">
      <h3>Electoral History</h3>
      <table><tr><td>2012</td><td>${el(r.w2012)} (${el(r.p2012)}) &mdash; margin ${el(r.m2012)}%</td></tr>
      <tr><td>2017</td><td>${el(r.w2017)} (${el(r.p2017)}) &mdash; margin ${el(r.m2017)}%</td></tr>
      <tr><td>2022</td><td>${el(r.w2022)} (${el(r.p2022)}) &mdash; margin ${el(r.m2022)}%</td></tr></table>
    </div>
    <div class="section">
      <h3>Current Representation</h3>
      <table><tr><td>MLA</td><td>${el(r.mla)} (${el(r.mla_party)})</td></tr>
      <tr><td>MP</td><td>${el(r.mp)} (${el(r.mp_party)})</td></tr>
      <tr><td>LS 2024</td><td>${el(r.ls24_winner)} (${el(r.ls24_party)})</td></tr></table>
    </div>
    <div class="section">
      <h3>Political DNA</h3>
      <table><tr><td>Classification</td><td>${r.dna.replace(/_/g,' ')}</td></tr>
      <tr><td>Detail</td><td>${r.dna_detail||'N/A'}</td></tr>
      <tr><td>Reasoning</td><td>${r.dna_reason||'N/A'}</td></tr></table>
    </div>
    <div class="section">
      <h3>Competitiveness</h3>
      <table><tr><td>Rating</td><td>${r.comp.replace(/_/g,' ')}</td></tr>
      <tr><td>Avg Margin</td><td>${r.comp_margin}%</td></tr>
      <tr><td>Trend</td><td>${r.comp_trend||'N/A'}</td></tr></table>
    </div>
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const fd = document.getElementById('filter-district').value;
  const fp = document.getElementById('filter-party').value;
  const fdna = document.getElementById('filter-dna').value;
  const fc = document.getElementById('filter-comp').value;

  const filtered = DATA.filter(r => {
    if (q && !r.name.toLowerCase().includes(q) && !r.mla.toLowerCase().includes(q) && !r.mp.toLowerCase().includes(q) && !r.district.toLowerCase().includes(q) && !r.pc_name.toLowerCase().includes(q)) return false;
    if (fd && r.district !== fd) return false;
    if (fp && r.p2022 !== fp) return false;
    if (fdna && r.dna !== fdna) return false;
    if (fc && r.comp !== fc) return false;
    return true;
  });

  document.getElementById('grid').innerHTML = filtered.map(card).join('');
  document.getElementById('stats').textContent = filtered.length + ' / 403 constituencies';
}

applyFilters();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
</script>
