name: Prepare Next.js 15.5 patch lockfile (temporary)

on:
  push:
    branches:
      - chore/prepare-next-1555-patch-lock

permissions:
  contents: write

jobs:
  generate:
    name: Generate and validate npm dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Audit tracked source for MapLibre imports/references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t source_files < <(git ls-files | grep -E '[.](ts|tsx|js|jsx|mjs|cjs)$' || true)
          if (("${#source_files[@]}" == 0)); then
            echo "BLOCKED: no tracked source files were discovered"
            exit 2
          fi
          if matches="$(git grep -n -i -E 'maplibre(-gl)?' -- "${source_files[@]}")"; then
            echo "MAPLIBRE_SOURCE_REFERENCES_FOUND"
            printf '%s\n' "$matches"
          else
            rc=$?
            if [[ "$rc" -eq 1 ]]; then
              echo "NO_TRACKED_SOURCE_REFERENCES_TO_MAPLIBRE"
            else
              echo "BLOCKED: git grep returned $rc"
              exit "$rc"
            fi
          fi

      - name: Remove unused MapLibre optimization hint
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'next.config.js';
          const original = fs.readFileSync(path, 'utf8');
          const before = "optimizePackageImports: ['d3', 'maplibre-gl', 'three']";
          const after = "optimizePackageImports: ['d3', 'three']";
          if (original.includes(before)) {
            fs.writeFileSync(path, original.replace(before, after));
            console.log('Removed MapLibre from optimizePackageImports; tracked-source grep found no MapLibre imports.');
          } else if (!original.includes('maplibre-gl')) {
            console.log('MapLibre optimization hint already removed.');
          } else {
            throw new Error('Unexpected MapLibre occurrence in next.config.js; refusing an unreviewed rewrite.');
          }
          NODE

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve patched Next.js 15.5 release with npm
        run: npm install next@15.5.27 --save-prefix="^" --ignore-scripts --no-audit --no-fund

      - name: Remove unused MapLibre dependency with npm
        run: npm uninstall maplibre-gl --ignore-scripts --no-audit --no-fund

      - name: Validate manifest-lock consistency and scoped dependency diff
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const config = fs.readFileSync('next.config.js', 'utf8');
          const declared = pkg.dependencies?.next;
          const locked = lock.packages?.['node_modules/next']?.version;
          const rootLockSpec = lock.packages?.['']?.dependencies?.next;
          if (declared !== '^15.5.27') throw new Error('Expected next range ^15.5.27, got ' + declared);
          if (rootLockSpec !== declared) throw new Error('Root lock spec disagrees: ' + rootLockSpec);
          if (locked !== '15.5.27') throw new Error('Expected locked Next 15.5.27, got ' + locked);
          if (pkg.dependencies?.['maplibre-gl'] || pkg.devDependencies?.['maplibre-gl']) throw new Error('MapLibre remains declared in package.json');
          if (lock.packages?.['node_modules/maplibre-gl']) throw new Error('MapLibre remains in the npm lockfile');
          if (config.includes('maplibre-gl')) throw new Error('MapLibre remains in next.config.js');
          console.log({ declared, rootLockSpec, locked, maplibreRemoved: true });
          NODE
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit npm-generated files on this temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json next.config.js
          if git diff --cached --quiet; then
            echo "npm generated no file changes"
          else
            git commit -m "chore(deps): patch Next.js and remove unused MapLibre"
            git push origin HEAD:refs/heads/chore/prepare-next-1555-patch-lock
          fi

      - name: Upload npm-generated files for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-15.5.27-and-maplibre-removal
          path: |
            package.json
            package-lock.json
            next.config.js
          if-no-files-found: error
          retention-days: 3
