name: Editorial Publication Scheduler

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: editorial-publish-due
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: Production

    steps:
      - name: Validate cron credential
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || {
            echo "CRON_SECRET is missing"
            exit 1
          }

      - name: Invoke canonical publisher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 45 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Cache-Control: no-store" \
            "https://thebreakdown.in/api/editorial/publish-due"
