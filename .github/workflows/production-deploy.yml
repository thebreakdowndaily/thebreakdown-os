name: POP-1.0 Production Infrastructure Pipeline

on:
  # Run release verification only after the shared CI Pipeline succeeds on a
  # branch promotion. Pull requests are fully validated by ci.yml.
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: 2. Verify Staging Deployment Health
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging' }}
    environment: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Staging Edge Verification
        env:
          DEPLOYMENT_URL: ${{ secrets.STAGING_DEPLOYMENT_URL || 'https://thebreakdown-os-git-staging-bholebababhakti108-makers-projects.vercel.app' }}
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Verifying Staging Deployment Health at $DEPLOYMENT_URL..."
          npx tsx scripts/verify-deployment-health.ts --url "$DEPLOYMENT_URL" --commit "$EXPECTED_COMMIT_SHA" --attempts 18 --interval 10

      - name: Execute Staging Corrections Persistence Smoke Test
        env:
          STAGING_DEPLOYMENT_URL: ${{ secrets.STAGING_DEPLOYMENT_URL || 'https://thebreakdown-os-git-staging-bholebababhakti108-makers-projects.vercel.app' }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://lvfovvidtowadmnggzzf.supabase.co' }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Executing Staging Reader-Corrections Persistence Smoke Test..."
          npx tsx scripts/verify-staging-corrections-smoke.ts

  deploy-production:
    name: 3. Verify Production Edge Health & Canary Gate
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Production Edge Verification
        env:
          DEPLOYMENT_URL: 'https://thebreakdown.in'
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Verifying Production Deployment Health at $DEPLOYMENT_URL..."
          npx tsx scripts/verify-deployment-health.ts --url "$DEPLOYMENT_URL" --commit "$EXPECTED_COMMIT_SHA" --attempts 24 --interval 10

      - name: Run Production Release Integrity Smoke Suite
        env:
          PROD_SMOKE_BASE: 'https://thebreakdown.in'
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Running production smoke tests against live edge..."
          npx tsx tests/production-deployment.test.ts
