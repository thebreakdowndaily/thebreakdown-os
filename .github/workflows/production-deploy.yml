name: POP-1.0 Production Infrastructure Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  validate-and-test:
    name: 1. Validate & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npm run check:type

      - name: Strict Linting Verification
        run: npm run check:lint

      - name: Security Regression Gate
        run: npm run test:security

      - name: Database Migration Safety Gate
        run: npm run test:migration

      - name: Master Architectural & Operational Test Suite
        run: |
          npx tsx tests/canonical-domain.test.ts
          npx tsx tests/projections/all-projections.test.ts
          npx tsx tests/cache-policy.test.ts
          npx tsx tests/reference-story.test.ts
          npx tsx tests/reader-product-surface.test.ts
          npx tsx tests/editorial-operating-system.test.ts
          npx tsx tests/e2e-workflow.test.ts
          npm run test:a11y
          npx tsx tests/production-readiness.test.ts
          npx tsx tests/data-integrity.test.ts

      - name: Release-Control Safety & Deployment Health Suites
        run: |
          npx vitest run tests/reconcile-cloudflare-safety.test.ts tests/verify-deployment-health.test.ts

      - name: Next.js Production Build Verification
        run: npm run build

  deploy-staging:
    name: 2. Verify Staging Deployment Health
    needs: validate-and-test
    if: github.ref == 'refs/heads/staging'
    environment: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Staging Edge Verification
        env:
          DEPLOYMENT_URL: ${{ secrets.STAGING_DEPLOYMENT_URL || 'https://thebreakdown-os-git-staging-bholebababhakti108-makers-projects.vercel.app' }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Verifying Staging Deployment Health at $DEPLOYMENT_URL..."
          npx tsx scripts/verify-deployment-health.ts --url "$DEPLOYMENT_URL" --commit "$EXPECTED_COMMIT_SHA" --attempts 18 --interval 10

  deploy-production:
    name: 3. Verify Production Edge Health & Canary Gate
    needs: validate-and-test
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Production Edge Verification
        env:
          DEPLOYMENT_URL: 'https://thebreakdown.in'
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Verifying Production Deployment Health at $DEPLOYMENT_URL..."
          npx tsx scripts/verify-deployment-health.ts --url "$DEPLOYMENT_URL" --commit "$EXPECTED_COMMIT_SHA" --attempts 24 --interval 10

      - name: Run Production Release Integrity Smoke Suite
        env:
          PROD_SMOKE_BASE: 'https://thebreakdown.in'
        run: |
          echo "Running production smoke tests against live edge..."
          npx tsx tests/production-deployment.test.ts
