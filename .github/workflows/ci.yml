name: CI Pipeline

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

jobs:
  validate-and-gate:
    name: Continuous Integration & Release Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 1. Clean Dependencies Installation
        run: npm ci

      - name: 2. Strict Typecheck Gate
        run: npm run check:type

      - name: 3. Strict Linting Gate
        run: npm run check:lint

      - name: 4. Security Regression Gate
        run: npm run test:security

      - name: 5. Database & Migration Safety Gate
        run: npm run test:migration

      - name: 6. Unit & Domain Test Suite
        run: npm run test

      - name: 7. Accessibility Validation Gate
        run: npm run test:a11y

      - name: 8. Production Next.js Build Verification
        run: npm run build
