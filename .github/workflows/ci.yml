name: CI Pipeline

on:
  # Validate feature branches once through pull_request; validate direct main updates through push.
  # This avoids running the full suite twice for each commit on an open PR branch.
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-build:
    name: Continuous Integration & Release Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Agent Skills
        run: python3 scripts/validate-skills.py

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 1. Clean Dependencies Installation
        run: npm ci

      - name: 2. Strict Typecheck Gate
        run: npm run check:type

      - name: 3. Strict Linting Gate
        run: npm run check:lint

      - name: 4. Security Regression Gate
        run: npm run test:security

      - name: 5. Database & Migration Safety Gate
        run: npm run test:migration

      - name: 6. Unit & Domain Test Suite
        run: npm run test

      - name: 7. Accessibility Token & Contrast Gate
        run: npm run test:a11y

      - name: 8. Production Next.js Build Verification
        run: npm run build

      - name: 9. Install Chromium for browser accessibility tests
        run: npx playwright install --with-deps chromium

      - name: 10. Browser DOM accessibility — desktop and mobile Chromium
        run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium --project="Mobile Chrome" --workers=1

      - name: Upload browser accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-accessibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
