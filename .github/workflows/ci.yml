name: CI Pipeline

on:
  # PR checks cover feature-branch commits; reserve push runs for branch
  # promotion so the same feature SHA is not built twice.
  push:
    branches: [main, staging]
  pull_request:

# Cancel superseded CI on a branch or PR, but never cancel release/deploy jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Continuous Integration & Release Gates
    runs-on: ubuntu-latest
    # Browser E2E uses the explicit in-memory data provider. Give client
    # imports inert local Supabase config so production-mode startup does not
    # fail merely because CI has no production credentials. Nothing listens on
    # this loopback port; these values must never be copied to deployment env.
    env:
      DATA_PROVIDER: memory
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-placeholder-anon-key-not-valid-for-production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Agent Skills
        run: python3 scripts/validate-skills.py

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 1. Clean Dependencies Installation
        run: npm ci

      - name: 2. Strict Typecheck Gate
        run: npm run check:type

      - name: 3. Strict Linting Gate
        run: npm run check:lint

      - name: 4. Security Regression Gate
        run: npm run test:security

      - name: Architecture & Operational Regression Gate
        if: github.event_name == 'push'
        run: |
          npx tsx tests/canonical-domain.test.ts
          npx tsx tests/projections/all-projections.test.ts
          npx tsx tests/cache-policy.test.ts
          npx tsx tests/reference-story.test.ts
          npx tsx tests/reader-product-surface.test.ts
          npx tsx tests/editorial-operating-system.test.ts
          npx tsx tests/e2e-workflow.test.ts
          npx tsx tests/production-readiness.test.ts
          npx tsx tests/data-integrity.test.ts

      - name: Release-Control Safety & Deployment Health Suites
        if: github.event_name == 'push'
        run: |
          npx vitest run tests/reconcile-cloudflare-safety.test.ts tests/verify-deployment-health.test.ts tests/staging-corrections-smoke.test.ts tests/reader-corrections-persistence.test.ts

      - name: 5. Database & Migration Safety Gate
        run: npm run test:migration

      - name: 6. Unit & Domain Test Suite
        run: npm run test

      - name: Forensic Root-Cause Regression Gate
        run: npm run test:forensic

      - name: 7. Accessibility Token & Contrast Gate
        run: npm run test:a11y

      - name: 8. Production Next.js Build Verification
        run: npm run build

      - name: 9. Install Chromium for browser accessibility tests
        run: npx playwright install --with-deps chromium

      - name: 10. Browser DOM accessibility — desktop and mobile Chromium
        run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium --project="Mobile Chrome" --workers=1

      - name: Upload browser accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-accessibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
