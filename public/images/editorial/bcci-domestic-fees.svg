<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">BCCI senior men's domestic daily fee tiers by match-count band</title>
<desc id="desc">A data graphic based on BCCI's September 2021 senior men's domestic daily fee table: 40,000 rupees for up to 20 matches, 50,000 for 21 to 40 matches, and 60,000 for more than 40 matches. The BCCI table says matches; this is not an annual salary.</desc>
<rect width="1200" height="630" fill="#101c2b"/><rect x="38" y="34" width="1124" height="562" rx="24" fill="#14263a" stroke="#38536d" stroke-width="2"/>
<text x="78" y="92" font-family="Arial,sans-serif" font-size="19" letter-spacing="4" fill="#83d6d0">THE BREAKDOWN · SPORTS ECONOMICS</text>
<text x="78" y="151" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#fff">What a Ranji playing day pays</text>
<text x="78" y="190" font-family="Arial,sans-serif" font-size="22" fill="#c7d6e5">BCCI senior men's domestic fee table · playing XI</text>
<text x="78" y="256" font-family="Arial,sans-serif" font-size="18" fill="#c7d6e5">Match-count tier</text><text x="570" y="256" font-family="Arial,sans-serif" font-size="18" fill="#c7d6e5">Per playing day</text>
<g><text x="78" y="317" font-family="Arial,sans-serif" font-size="24" fill="#fff">Up to 20 matches</text><rect x="380" y="288" width="390" height="36" rx="8" fill="#203e56"/><rect x="380" y="288" width="200" height="36" rx="8" fill="#58bdb4"/><text x="805" y="316" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">₹40,000</text></g><g><text x="78" y="383" font-family="Arial,sans-serif" font-size="24" fill="#fff">21–40 matches</text><rect x="380" y="354" width="390" height="36" rx="8" fill="#203e56"/><rect x="380" y="354" width="250" height="36" rx="8" fill="#58bdb4"/><text x="805" y="382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">₹50,000</text></g><g><text x="78" y="449" font-family="Arial,sans-serif" font-size="24" fill="#fff">More than 40</text><rect x="380" y="420" width="390" height="36" rx="8" fill="#203e56"/><rect x="380" y="420" width="300" height="36" rx="8" fill="#58bdb4"/><text x="805" y="448" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">₹60,000</text></g>
<rect x="78" y="494" width="1044" height="50" rx="12" fill="#203247" stroke="#4e718d"/><text x="100" y="525" font-family="Arial,sans-serif" font-size="16" fill="#d8e6f0">Reserves have separate rates. Match-count tier as listed by BCCI; this is not annual salary or guaranteed take-home pay.</text>
<text x="78" y="567" font-family="Arial,sans-serif" font-size="14" fill="#9bb4ca">Sources: BCCI fee table (20 Sep 2021); The New Indian Express (20 May 2026). Daily rate, not salary.</text>
</svg>