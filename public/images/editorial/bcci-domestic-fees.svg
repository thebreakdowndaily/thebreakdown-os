<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Senior men's Ranji Trophy playing fee by first-class match experience</title>
<desc id="desc">An original comparison of BCCI's announced senior domestic first-class playing fees per day: 40,000 rupees for up to 20 matches, 50,000 for 21 to 40 matches, and 60,000 for more than 40 matches.</desc>
<rect width="1200" height="630" fill="#101c2b"/><rect x="38" y="34" width="1124" height="562" rx="24" fill="#14263a" stroke="#38536d" stroke-width="2"/>
<text x="78" y="92" font-family="Arial,sans-serif" font-size="19" letter-spacing="4" fill="#83d6d0">THE BREAKDOWN · SPORTS ECONOMICS</text>
<text x="78" y="151" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#fff">What a Ranji playing day pays</text>
<text x="78" y="190" font-family="Arial,sans-serif" font-size="22" fill="#c7d6e5">BCCI senior men's domestic first-class fee schedule · playing XI</text>
<text x="78" y="256" font-family="Arial,sans-serif" font-size="18" fill="#c7d6e5">First-class experience</text><text x="570" y="256" font-family="Arial,sans-serif" font-size="18" fill="#c7d6e5">Per playing day</text>
<g><text x="78" y="317" font-family="Arial,sans-serif" font-size="24" fill="#fff">Up to 20 matches</text><rect x="380" y="288" width="390" height="36" rx="8" fill="#203e56"/><rect x="380" y="288" width="160" height="36" rx="8" fill="#58bdb4"/><text x="805" y="316" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">₹40,000</text></g><g><text x="78" y="383" font-family="Arial,sans-serif" font-size="24" fill="#fff">21–40 matches</text><rect x="380" y="354" width="390" height="36" rx="8" fill="#203e56"/><rect x="380" y="354" width="220" height="36" rx="8" fill="#58bdb4"/><text x="805" y="382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">₹50,000</text></g><g><text x="78" y="449" font-family="Arial,sans-serif" font-size="24" fill="#fff">More than 40</text><rect x="380" y="420" width="390" height="36" rx="8" fill="#203e56"/><rect x="380" y="420" width="280" height="36" rx="8" fill="#58bdb4"/><text x="805" y="448" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">₹60,000</text></g>
