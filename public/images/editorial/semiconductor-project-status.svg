<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">India semiconductor programme status as of September 2026</title>
<desc id="desc">An original graphic separating programme approvals from commercial production: 12 units approved, over 1.64 lakh crore rupees in cumulative investment, and five units reported as having commenced commercial production in official September 2026 releases.</desc>
<rect width="1200" height="630" fill="#101c2b"/><rect x="38" y="34" width="1124" height="562" rx="24" fill="#14263a" stroke="#38536d" stroke-width="2"/>
<text x="78" y="92" font-family="Arial,sans-serif" font-size="19" letter-spacing="4" fill="#83d6d0">THE BREAKDOWN · STATUS GRAPHIC</text>
<text x="78" y="151" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#fff">Approval is not output</text>
<text x="78" y="190" font-family="Arial,sans-serif" font-size="22" fill="#c7d6e5">India Semiconductor Mission 1.0 · official PIB updates, 17–18 September 2026</text>
<rect x="78" y="244" width="310" height="196" rx="18" fill="#203e56" stroke="#4f718a"/><text x="108" y="302" font-family="Arial,sans-serif" font-size="20" fill="#b8d7e8">Approved units</text><text x="108" y="373" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#fff">12</text><text x="108" y="411" font-family="Arial,sans-serif" font-size="15" fill="#c7d6e5">Fab, display and packaging projects</text>
<rect x="445" y="244" width="310" height="196" rx="18" fill="#203e56" stroke="#4f718a"/><text x="475" y="302" font-family="Arial,sans-serif" font-size="20" fill="#b8d7e8">Planned investment</text><text x="475" y="373" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#fff">₹1.64L cr+</text><text x="475" y="411" font-family="Arial,sans-serif" font-size="15" fill="#c7d6e5">Cumulative approved proposals</text>
<rect x="812" y="244" width="310" height="196" rx="18" fill="#203e56" stroke="#4f718a"/><text x="842" y="302" font-family="Arial,sans-serif" font-size="20" fill="#b8d7e8">Commercial production</text><text x="842" y="373" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#8de0d5">5</text><text x="842" y="411" font-family="Arial,sans-serif" font-size="15" fill="#c7d6e5">Plants reported operational</text>
<text x="78" y="495" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">The key distinction</text><text x="78" y="527" font-family="Arial,sans-serif" font-size="17" fill="#c7d6e5">Packaging capacity can start before a leading silicon wafer fab reaches commercial yield.</text>
<text x="78" y="558" font-family="Arial,sans-serif" font-size="14" fill="#9bb4ca">Source: PIB updates, 17–18 September 2026. Values describe different milestones.</text>
</svg>