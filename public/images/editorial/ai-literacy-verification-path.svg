<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">A five-step AI answer verification path</title>
<desc id="desc">An original editorial diagram: identify a claim, locate the cited source, open the primary record, compare the evidence, and record what remains uncertain.</desc>
<rect width="1200" height="630" fill="#101c2b"/><rect x="38" y="34" width="1124" height="562" rx="24" fill="#14263a" stroke="#38536d" stroke-width="2"/>
<text x="78" y="92" font-family="Arial, sans-serif" font-size="19" letter-spacing="4" fill="#83d6d0">THE BREAKDOWN · EXPLAINER GRAPHIC</text>
<text x="78" y="151" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Don't stop at the answer</text>
<text x="78" y="190" font-family="Arial, sans-serif" font-size="23" fill="#c7d6e5">A practical verification routine for AI-assisted schoolwork</text>
<g><rect x="78" y="253" width="190" height="222" rx="16" fill="#1e3a52" stroke="#4e718d"/><circle cx="173" cy="298" r="28" fill="#8de0d5"/><text x="173" y="306" font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#10243a">01</text><text x="173" y="358" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Identify</text><text x="173" y="399" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#cfdeec">Is there a factual claim?</text></g><g><rect x="298" y="253" width="190" height="222" rx="16" fill="#203247" stroke="#4e718d"/><circle cx="393" cy="298" r="28" fill="#8de0d5"/><text x="393" y="306" font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#10243a">02</text><text x="393" y="358" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Trace</text><text x="393" y="399" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#cfdeec">Where did the answer get it?</text></g><g><rect x="518" y="253" width="190" height="222" rx="16" fill="#1e3a52" stroke="#4e718d"/><circle cx="613" cy="298" r="28" fill="#8de0d5"/><text x="613" y="306" font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#10243a">03</text><text x="613" y="358" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Open</text><text x="613" y="399" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#cfdeec">Read the primary document.</text></g><g><rect x="738" y="253" width="190" height="222" rx="16" fill="#203247" stroke="#4e718d"/><circle cx="833" cy="298" r="28" fill="#8de0d5"/><text x="833" y="306" font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#10243a">04</text><text x="833" y="358" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Compare</text><text x="833" y="399" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#cfdeec">Does the source support it?</text></g><g><rect x="958" y="253" width="190" height="222" rx="16" fill="#1e3a52" stroke="#4e718d"/><circle cx="1053" cy="298" r="28" fill="#8de0d5"/><text x="1053" y="306" font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#10243a">05</text><text x="1053" y="358" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Record</text><text x="1053" y="399" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#cfdeec">Mark gaps and uncertainty.</text></g>
<text x="78" y="523" font-family="Arial,sans-serif" font-size="16" fill="#c7d6e5">Original editorial diagram · Workflow recommendation, not a survey result</text>
<text x="78" y="555" font-family="Arial,sans-serif" font-size="14" fill="#9bb4ca">Basis: CBSE CT&amp;AI curriculum resources (2026–27); UNESCO guidance on generative AI in education.</text>
</svg>