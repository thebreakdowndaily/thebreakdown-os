<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <rect x="100" y="80" width="1000" height="470" rx="16" fill="#141414" stroke="#262626" stroke-width="2"/>
  
  <!-- Subtle Grid Accent -->
  <line x1="100" y1="180" x2="1100" y2="180" stroke="#262626" stroke-width="1.5"/>
  <line x1="450" y1="180" x2="450" y2="550" stroke="#262626" stroke-width="1.5"/>
  
  <!-- The Breakdown Badge -->
  <rect x="140" y="120" width="160" height="32" rx="4" fill="#FFD900" fill-opacity="0.1" stroke="#FFD900" stroke-opacity="0.3" stroke-width="1"/>
  <text x="152" y="141" font-family="monospace" font-size="12" font-weight="bold" fill="#FFD900" letter-spacing="2">INVESTIGATION</text>
  
  <text x="320" y="141" font-family="sans-serif" font-size="13" font-weight="bold" fill="#737373">THE BREAKDOWN OS</text>

  <!-- Left Column: Conceptual Architecture -->
  <text x="140" y="230" font-family="monospace" font-size="12" font-weight="bold" fill="#A3A3A3" letter-spacing="1">EVIDENTIARY DOSSIER</text>
  <rect x="140" y="250" width="260" height="12" rx="3" fill="#404040"/>
  <rect x="140" y="275" width="220" height="12" rx="3" fill="#333333"/>
  <rect x="140" y="300" width="240" height="12" rx="3" fill="#262626"/>

  <rect x="140" y="350" width="260" height="80" rx="8" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
  <text x="160" y="380" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">CAG AUDITED RECORDS</text>
  <text x="160" y="405" font-family="monospace" font-size="16" font-weight="bold" fill="#FFFFFF">Report No. 4 of 2026</text>

  <!-- Right Column: Institutional Pillars -->
  <text x="490" y="230" font-family="monospace" font-size="12" font-weight="bold" fill="#A3A3A3" letter-spacing="1">INSTITUTIONAL ACCOUNTABILITY CHAIN</text>
  
  <!-- Step 1: Power -->
  <rect x="490" y="260" width="170" height="50" rx="8" fill="#1C1917" stroke="#FFD900" stroke-opacity="0.4" stroke-width="1"/>
  <text x="505" y="282" font-family="monospace" font-size="10" font-weight="bold" fill="#FFD900">01. STATUTORY POWER</text>
  <text x="505" y="300" font-family="sans-serif" font-size="11" fill="#D6D3D1">Legislative Mandate</text>

  <!-- Arrow -->
  <path d="M670 285 L690 285" stroke="#52525B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Duty -->
  <rect x="700" y="260" width="170" height="50" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
  <text x="715" y="282" font-family="monospace" font-size="10" font-weight="bold" fill="#38BDF8">02. LEGAL DUTY</text>
  <text x="715" y="300" font-family="sans-serif" font-size="11" fill="#A1A1AA">Public Administration</text>

  <!-- Arrow -->
  <path d="M880 285 L900 285" stroke="#52525B" stroke-width="2"/>

  <!-- Step 3: Consequence -->
  <rect x="910" y="260" width="150" height="50" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
  <text x="925" y="282" font-family="monospace" font-size="10" font-weight="bold" fill="#F43F5E">03. SANCTION</text>
  <text x="925" y="300" font-family="sans-serif" font-size="11" fill="#A1A1AA">Strict State Liability</text>

  <!-- Jurisprudence Box -->
  <rect x="490" y="340" width="570" height="150" rx="8" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="515" y="375" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">When Something Goes Wrong, Who Actually Answers?</text>
  <text x="515" y="405" font-family="sans-serif" font-size="13" fill="#A3A3A3">A forensic explainer tracing accountability from rural wage ledgers to the Supreme Court.</text>
  <text x="515" y="450" font-family="monospace" font-size="11" fill="#737373">JURISPRUDENCE • AUDITS • CONSTITUTIONAL REMEDIES • PUBLIC LAW</text>
</svg>
