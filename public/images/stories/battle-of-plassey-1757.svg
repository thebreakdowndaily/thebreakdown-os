<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grovePattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="4" fill="#15803d" opacity="0.6"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Bhagirathi River Path -->
  <path d="M 180 0 C 220 180, 140 320, 200 480 C 240 580, 210 640, 220 675 L 120 675 C 110 640, 140 580, 100 480 C 40 320, 120 180, 80 0 Z" fill="url(#riverGrad)"/>
  <text x="140" y="340" fill="#93c5fd" font-family="serif" font-size="14" font-style="italic" transform="rotate(75, 140, 340)" letter-spacing="3">BHAGIRATHI RIVER</text>

  <!-- Title & Header -->
  <rect x="50" y="30" width="1100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="80" y="60" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="1">BATTLE OF PLASSEY — 23 JUNE 1757</text>
  <text x="80" y="82" fill="#94a3b8" font-family="sans-serif" font-size="13">Tactical Disposition Map: The Pre-Arranged Treason and the Decisive Noon Monsoon Contingency</text>
  <rect x="990" y="45" width="140" height="35" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="1005" y="68" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">HISTORICAL PILOT</text>

  <!-- Lakshmipur Mango Grove (Clive's Defensive Position) -->
  <rect x="240" y="360" width="220" height="180" rx="12" fill="url(#grovePattern)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="250" y="370" width="200" height="40" rx="6" fill="#0f172a" opacity="0.9"/>
  <text x="260" y="388" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">Lakshmipur Mango Grove</text>
  <text x="260" y="402" fill="#86efac" font-family="sans-serif" font-size="11">Clive's Force (~3,000 men &amp; 8 light guns)</text>
  
  <!-- Tarpaulin Highlight Note -->
  <rect x="250" y="460" width="200" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="260" y="480" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">12:00 PM Rainstorm</text>
  <text x="260" y="496" fill="#e2e8f0" font-family="sans-serif" font-size="10">British powder covered with tarpaulins.</text>
  <text x="260" y="510" fill="#e2e8f0" font-family="sans-serif" font-size="10">Artillery stayed dry and fully operational.</text>

  <!-- Plassey Hunting House -->
  <rect x="220" y="270" width="80" height="50" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="225" y="295" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">Hunting</text>
  <text x="225" y="308" fill="#cbd5e1" font-family="sans-serif" font-size="9">Lodge (Clive HQ)</text>

  <!-- Water Tank / Pond / French Artillery Redoubt -->
  <ellipse cx="620" cy="380" rx="40" ry="25" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="600" y="384" fill="#bfdbfe" font-family="sans-serif" font-size="10">Water Tank</text>
  <rect x="670" y="360" width="90" height="45" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="678" y="378" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold">St. Frais Redoubt</text>
  <text x="678" y="392" fill="#f87171" font-family="sans-serif" font-size="9">40 French Gunners</text>

  <!-- Mir Madan's Vanguard Position (Loyal Division) -->
  <rect x="580" y="260" width="220" height="70" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="285" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="bold">Mir Madan &amp; Mohan Lal</text>
  <text x="595" y="302" fill="#fee2e2" font-family="sans-serif" font-size="11">~12,000 Vanguard (Fought courageously)</text>
  <text x="595" y="318" fill="#f87171" font-family="sans-serif" font-size="10">Powder soaked at noon; Madan mortally hit</text>

  <!-- Treacherous Divisions (The 35,000 Paralyzed Troops) -->
  <!-- Mir Jafar's Division -->
  <g transform="translate(860, 440)">
    <rect width="280" height="75" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
    <text x="15" y="26" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="bold">Mir Jafar Ali Khan</text>
    <text x="15" y="44" fill="#c7d2fe" font-family="sans-serif" font-size="11">Commander-in-Chief (~15,000 Cavalry &amp; Foot)</text>
    <text x="15" y="62" fill="#fcd34d" font-family="sans-serif" font-size="10" font-weight="bold">STATIONARY: Secret treaty signed 4 June</text>
  </g>

  <!-- Yar Latif Khan's Division -->
  <g transform="translate(860, 340)">
    <rect width="280" height="75" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
    <text x="15" y="26" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="bold">Yar Latif Khan</text>
    <text x="15" y="44" fill="#c7d2fe" font-family="sans-serif" font-size="11">Division Commander (~10,000 troops)</text>
    <text x="15" y="62" fill="#fcd34d" font-family="sans-serif" font-size="10" font-weight="bold">STATIONARY: Pledged to the conspiracy</text>
  </g>

  <!-- Rai Durlabh's Division -->
  <g transform="translate(860, 240)">
    <rect width="280" height="75" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
    <text x="15" y="26" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="bold">Rai Durlabh</text>
    <text x="15" y="44" fill="#c7d2fe" font-family="sans-serif" font-size="11">Finance Minister (~10,000 troops)</text>
    <text x="15" y="62" fill="#fcd34d" font-family="sans-serif" font-size="10" font-weight="bold">STATIONARY: Allied with House of Jagat Seth</text>
  </g>

  <!-- Entrenched Camp of the Nawab -->
  <path d="M 520 140 L 980 140 L 980 190 L 520 190 Z" fill="#312e81" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="640" y="170" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="bold">Nawab Siraj ud-Daulah's Entrenched Camp</text>

  <!-- Tactical Arrows -->
  <!-- Mir Madan charge -->
  <path d="M 620 330 L 480 390" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)" stroke-dasharray="4,4"/>
  <text x="520" y="350" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">12:15 PM Fatal Charge</text>

  <!-- British grape shot return fire -->
  <path d="M 460 410 L 580 360" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="470" y="430" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Dry Grape-Shot Fire</text>

  <!-- Clive final advance after retreat ordered -->
  <path d="M 460 460 L 670 410" stroke="#4ade80" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="480" y="475" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">2:00 PM British Counter-Advance</text>

  <!-- Legend & Bottom Meta Bar -->
  <rect x="50" y="580" width="1100" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <rect x="70" y="605" width="20" height="12" fill="#15803d"/>
  <text x="100" y="615" fill="#e2e8f0" font-family="sans-serif" font-size="11">British / Sepoy Positions (Clive)</text>
  
  <rect x="340" y="605" width="20" height="12" fill="#dc2626"/>
  <text x="370" y="615" fill="#e2e8f0" font-family="sans-serif" font-size="11">Loyal Vanguard (Mir Madan &amp; French)</text>
  
  <rect x="660" y="605" width="20" height="12" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="690" y="615" fill="#e2e8f0" font-family="sans-serif" font-size="11">35,000 Conspirators' Troops (Motionless)</text>

  <text x="1000" y="625" fill="#64748b" font-family="sans-serif" font-size="10">The Breakdown Research Desk</text>
</svg>
