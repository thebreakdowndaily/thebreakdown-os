<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">India–Indonesia maritime partnership</title><desc id="desc">Editorial illustration of India and Indonesia linked by a maritime trade route, cargo vessel, and diplomatic flags across the Indo-Pacific.</desc>
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0a203e"/><stop offset="1" stop-color="#0b5363"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#167d93"/><stop offset="1" stop-color="#082f48"/></linearGradient><pattern id="waves" width="150" height="44" patternUnits="userSpaceOnUse"><path d="M0 20q22-12 45 0t45 0t60 0" fill="none" stroke="#9adfe2" stroke-opacity=".18" stroke-width="3"/></pattern></defs>
 <rect width="1600" height="900" fill="url(#sky)"/><circle cx="800" cy="270" r="210" fill="#75ced3" opacity=".08"/><path d="M0 468Q240 420 430 473T800 465T1210 470T1600 440V900H0Z" fill="url(#sea)"/><path d="M0 490Q240 442 430 495T800 487T1210 492T1600 462V900H0Z" fill="url(#waves)"/>
