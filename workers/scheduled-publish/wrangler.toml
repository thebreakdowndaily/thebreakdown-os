name = "thebreakdown-scheduled-publish"
main = "dist/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 * * * *"]

[vars]
APP_URL = "https://thebreakdown.in"

# Set CRON_SECRET using a Cloudflare Worker secret binding, not a plaintext var:
#   npx wrangler secret put CRON_SECRET
# It must match the application's CRON_SECRET. Do not add Supabase service-role
# credentials to this Worker; all publication goes through the guarded API.
