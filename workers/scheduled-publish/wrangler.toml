name = "thebreakdown-scheduled-publish"
main = "dist/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 * * * *"]

[vars]
APP_URL = "https://thebreakdown.in"
DRY_RUN = "true"

# Safe by default: hourly cron calls only the read-only preflight endpoint.
# Set DRY_RUN = "false" only after explicit publication-release authorization.
# Configure CRON_SECRET with: wrangler secret put CRON_SECRET
# Do not store CRON_SECRET or database credentials in [vars].
